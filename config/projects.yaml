# Registry of private projects distributed through this tap.
#
# Each project repo should trigger the update-tap workflow on release
# (see .github/workflows/update-tap.yml and docs/PROJECT_REPO_INTEGRATION.md).
#
# Fields:
#   name:        Formula name (lowercase, hyphens) — matches `brew install <name>`
#   github_org:  GitHub organization or user that owns the private repo
#   repo:        Repository name (without org prefix)
#   description: Short description shown in `brew info`
#   homepage:    Project homepage or repo URL
#   binary:      Name of the executable inside the release archive
#   asset_pattern: Go template for the release asset filename. Variables:
#                  {{ .Version }}  — version without leading "v"
#                  {{ .OS }}       — "darwin" or "linux"
#                  {{ .Arch }}     — "arm64" or "amd64"
#
# Example entry:
#
#   - name: project-x
#     github_org: my-org
#     repo: project-x
#     description: "CLI tool for doing X"
#     homepage: https://github.com/my-org/project-x
#     binary: project-x
#     asset_pattern: "project-x-{{ .Version }}-{{ .OS }}-{{ .Arch }}.tar.gz"

projects: []
