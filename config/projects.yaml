# Registry of private projects distributed through this tap.
#
# Each project repo should trigger the update-tap workflow on release
# (see .github/workflows/update-tap.yml and docs/PROJECT_REPO_INTEGRATION.md).
#
# Fields:
#   name:        Formula/Cask name — matches `brew install <name>` or `brew install --cask <name>`
#   github_org:  GitHub organization or user that owns the private repo
#   repo:        Repository name (without org prefix)
#   description: Short description shown in `brew info` (must be < 80 chars)
#   homepage:    Project homepage or repo URL
#   binary:      Name of the executable inside the release archive (Formula only)
#   kind:        formula | cask | both
#   cask_asset_pattern: macOS DMG filename template (for cask automation)
#   formula_asset_pattern: Linux tarball filename template (for formula automation)
#
# Template variables:
#   {{ .Version }}  — version without leading "v"
#   {{ .OS }}       — "linux" (formula) or "macOS" (cask)
#   {{ .Arch }}     — "amd64", "arm64", or "universal"

projects:
  - name: 0x-excali
    github_org: krafterlabs
    repo: 0x-excali
    description: "Create, organize, and version your drawings with GitHub sync"
    homepage: https://github.com/krafterlabs/0x-excali
    binary: 0x-excali
    kind: both
    cask_asset_pattern: "0x-excali-production-macOS-universal-v{{ .Version }}.dmg"
    formula_asset_pattern: "0x-excali-production-linux-amd64-v{{ .Version }}.tar.gz"
